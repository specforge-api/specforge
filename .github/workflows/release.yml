name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pypi-publish:
    name: Build package and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI bundle
        run: |
          cd frontend
          npm ci
          npm run build
          # Ensure compiled HTML is copied into the python package assets
          mkdir -p ../src/specforge/assets
          cp dist/index.html ../src/specforge/assets/index.html

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
